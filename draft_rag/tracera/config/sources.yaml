# config/sources.yaml
#
# Declarative registry of trusted RSS sources. To add a new source later,
# just add an entry here — no code changes needed. The `category` field
# is free-form and will be used for metadata filtering in Phase 6.
#
# Only feeds that explicitly allow syndication (i.e. publish an RSS/Atom
# feed for public consumption) are listed here. We do not scrape sites
# that disallow it in their robots.txt.
#
# Every URL below was manually verified live before being added — see
# ingestion/feed_validator.py for the automated startup check that
# re-verifies these on every run, since feed URLs do go stale over time.
#
# Sources that were removed and why (kept here as a record so nobody
# re-adds them by accident):
#   - Reuters ("reutersagency.com/feed/?best-topics=world&post_type=best")
#     Reuters discontinued public RSS feeds in June 2020. This URL
#     serves an HTML landing page, not an RSS/Atom feed — the collector
#     now rejects it automatically, but it's removed here too.
#   - The Hindu ("thehindu.com/news/national/feeder/default.rss")
#     Blocks automated/non-browser requests outright.

rss_sources:
  - name: "BBC News - World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    publisher: "BBC News"
    category: "world"

  - name: "Al Jazeera - All News"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    publisher: "Al Jazeera"
    category: "world"

  - name: "NPR - News"
    url: "https://feeds.npr.org/1001/rss.xml"
    publisher: "NPR"
    category: "general"
    # Known limitation: NPR's RSS feeds have been reported to return
    # HTTP 403 for requests originating outside the US on some networks
    # (geoblocking, first observed widely in Nov 2025). If this source
    # shows as INVALID in the startup validation report on your network,
    # that's why — the fix is to run ingestion from a US-based network/
    # VPN, or drop this source from the list.

  - name: "NDTV News - Top Stories"
    url: "https://feeds.feedburner.com/ndtvnews-top-stories"
    publisher: "NDTV"
    category: "national"

  - name: "The Guardian - World"
    url: "https://www.theguardian.com/world/rss"
    publisher: "The Guardian"
    category: "world"

# GDELT queries. Each entry becomes a separate query against the GDELT
# DOC 2.0 API. `query` follows GDELT's query syntax (supports boolean
# operators, domain filters, etc). These are API queries, not URLs, so
# they aren't subject to the same "is this really an RSS feed" check —
# GDELT's DOC 2.0 endpoint itself is queried directly by
# ingestion/gdelt_collector.py.
gdelt_queries:
  - name: "India Politics"
    query: "India politics"
    category: "national"

  - name: "Global Health"
    query: "public health OR healthcare"
    category: "health"

  - name: "Technology and AI"
    query: "artificial intelligence"
    category: "technology"
