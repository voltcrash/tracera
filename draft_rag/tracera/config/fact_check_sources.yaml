# config/fact_check_sources.yaml
#
# Fact-checking organizations, kept separate from config/sources.yaml
# (general news outlets) for two reasons:
#
# 1. These sources feed the claim verification pipeline (Phase 11), not
#    the general news corpus — keeping them in their own file makes it
#    obvious which sources back which part of the system.
# 2. Fact-checking orgs get a different `category` value ("fact-check")
#    so they're easy to filter to/exclude from in retrieval (Phase 6)
#    without needing a naming convention inside sources.yaml.
#
# Same shape as sources.yaml's rss_sources list, so the exact same
# collector code (ingestion/rss_collector.py: collect_all_rss) works on
# both files unchanged — see ingestion/pipeline.py.
#
# Every URL below was manually verified live before being added.
#
# Sources that were checked and excluded, and why:
#   - Snopes ("snopes.com/feed") — returns HTTP 402 (Payment Required)
#     as of this writing; their RSS feed now appears to be gated.
#   - AFP Fact Check (factcheck.afp.com) — no publicly documented,
#     independently verifiable RSS endpoint was found. AFP's fact-check
#     content is reachable via GDELT queries instead (see
#     gdelt_queries below) until/unless a real feed URL turns up.

fact_check_sources:
  - name: "PolitiFact - Fact-checks"
    url: "https://politifact.com/rss/factchecks/"
    publisher: "PolitiFact"
    category: "fact-check"

  - name: "FactCheck.org"
    url: "https://www.factcheck.org/feed/"
    publisher: "FactCheck.org"
    category: "fact-check"

  - name: "Full Fact"
    url: "https://fullfact.org/feed/"
    publisher: "Full Fact"
    category: "fact-check"

# Supplementary GDELT queries scoped to fact-checking coverage, useful
# for surfacing fact-check articles from organizations that don't have
# (or don't expose) a working public RSS feed.
gdelt_queries:
  - name: "AFP Fact Check Coverage"
    query: "domain:factcheck.afp.com"
    category: "fact-check"

  - name: "Snopes Coverage"
    query: "domain:snopes.com"
    category: "fact-check"
