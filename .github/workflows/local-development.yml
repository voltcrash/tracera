name: Local development

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Install Chromium
        run: vp exec --filter web --fail-if-no-match -- playwright install --with-deps chromium
      - name: Check formatting, lint, and types
        run: vp check
      - name: Check workspace types
        run: vp run check-types
      - name: Build the Worker
        run: vp run build
      - name: Dry-run the staging Worker deploy
        run: vp run web#deploy:staging-dry-run
      - name: Run unit suites without external networking
        run: scripts/ci/with-network-denied.sh vp test --run
      - name: Run Worker browser suites without external networking
        run: scripts/ci/with-network-denied.sh vp run test:browser
