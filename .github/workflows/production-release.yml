name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tracera-production-release
  cancel-in-progress: false

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_CF_FETCH_ENABLED: "false"

jobs:
  deploy:
    if: >-
      github.repository == 'voltcrash/tracera' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: production
      url: https://tracera.voltcrash.com
    steps:
      - name: Check out the run's main snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false

      - name: Require successful CI for the deployment commit
        id: validate-ci
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { requireSuccessfulProductionCI } = await import(`${process.env.GITHUB_WORKSPACE}/packages/release/src/production-validation.js`);
            const run = await requireSuccessfulProductionCI({ github, context, sha: process.env.DEPLOYMENT_SHA });
            await core.summary.addLink('Validated CI', run.html_url).write();

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Prepare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_WORKER_ENV: ${{ secrets.PRODUCTION_WORKER_ENV }}
        run: |
          node --input-type=module <<'NODE'
          import { writeProductionWorkerEnv } from './packages/release/src/production-settings.js';
          writeProductionWorkerEnv({ cwd: process.cwd(), environment: process.env });
          NODE

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build production frontend and Worker
        env:
          TRACERA_BUILD_ID: ${{ env.DEPLOYMENT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: vp run build:production

      - name: Check production deployment
        run: vp run deploy:production-dry-run

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run db:migrate:production

      - name: Deploy production with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run deploy:production

      - name: Remove private settings
        if: always()
        run: rm -f apps/web/.dev.vars.production
