packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAge: 0
allowBuilds:
  "@prisma/client": true
  better-sqlite3: true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  spawn-sync: true
  utf-8-validate: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  "@esbuild-kit/core-utils>esbuild": 0.28.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
